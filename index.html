<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Zeebo</title><style>body{margin:0;background:#111;color:white;font:15px system-ui}canvas{width:100vw;height:100dvh;display:block;touch-action:none}#hud{position:absolute;top:12px;left:12px;background:#111c;padding:12px;pointer-events:none}#controls{position:absolute;bottom:20px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:8px}button{background:#20202cbb;color:white;border:1px solid #aaa8;border-radius:30px;padding:16px;touch-action:none}#map{position:absolute;inset:15% 10% 30%;background:#171d25;overflow:auto;padding:12px}#map button{display:block;width:100%}</style><canvas id="c"></canvas><div id="hud"></div><div id="map" hidden></div><div id="controls"><button data-k="a">◀</button><button data-k="w">▲</button><button data-k="s">▼</button><button data-k="d">▶</button><button onclick="interact()">Use</button><button onclick="ride()">Ride</button><button onclick="attack(false)">Strike</button><button onclick="attack(true)">Cast</button><button onclick="map.hidden=!map.hidden">Map</button><button onclick="save()">Save</button><button onclick="load()">Load</button></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),hud=document.getElementById('hud'),map=document.getElementById('map');let p={x:0,z:0,a:0,hp:100,mana:100,money:0,xp:0,quest:0,bike:false,riding:false},keys={},last=0,msg='Visit delivery depot';const regions=['Zeebo','Valdoria','Iron Republic','Forgotten Realm','Freeborn Frontier','Frozen Empire','Hollow Order','Stormbreak Coast','Ashen Highlands','Silverwood Wilds'];const sites=regions.map((name,i)=>({name,x:(i%5)*220,z:Math.floor(i/5)*220+35}));const depot={x:0,z:12,name:'Delivery depot'},market={x:18,z:30,name:'Market'},garage={x:-18,z:30,name:'Garage'};const objects=[depot,market,garage,...sites];let enemies=sites.slice(1).map((s,i)=>({x:s.x+8,z:s.z+10,hp:40,max:40,name:i===2?'Dragon':'Guardian',dead:0}));function say(t){msg=t}function save(){try{localStorage.setItem('zeebo-new-v1',JSON.stringify(p));say('Saved')}catch(e){say('Storage unavailable')}}function load(){try{let v=localStorage.getItem('zeebo-new-v1');if(v){p=JSON.parse(v);say('Loaded')}else say('No save yet')}catch(e){say('Load failed')}}function near(o,r=8){return Math.hypot(p.x-o.x,p.z-o.z)<r}function interact(){if(near(depot)&&p.quest===0){p.quest=1;say('Package collected. Deliver to market.')}else if(near(market)&&p.quest===1){p.quest=2;p.money+=60;p.xp+=20;say('Delivery complete +60 Zero')}else if(near(garage)){p.bike=true;say('Junk bike acquired')}else say('Approach a marked location to interact')}function ride(){if(p.bike){p.riding=!p.riding;say(p.riding?'Riding':'On foot')}else say('Visit the garage first')}function attack(magic){if(magic&&p.mana<10){say('Not enough mana');return}if(magic)p.mana-=10;let e=enemies.filter(e=>e.hp>0&&near(e,magic?22:7))[0];if(!e){say(magic?'Ember Spark':'Strike');return}e.hp-=magic?24:15;if(e.hp<=0){e.dead=performance.now()+3000;p.xp+=35;p.money+=25;say(e.name+' defeated +25 Zero')}else say(e.name+' hit')}
for(let s of objects){let b=document.createElement('button');b.textContent=s.name;b.onclick=()=>{p.x=s.x;p.z=s.z-5;map.hidden=true;say(s.name)};map.append(b)}document.querySelectorAll('[data-k]').forEach(b=>{b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys[b.dataset.k]=true};b.onpointerup=b.onpointercancel=()=>keys[b.dataset.k]=false});onkeydown=e=>keys[e.key.toLowerCase()]=true;onkeyup=e=>keys[e.key.toLowerCase()]=false;let drag=null;c.onpointerdown=e=>{drag=e.clientX;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(drag!==null){p.a+=(e.clientX-drag)*.008;drag=e.clientX}};c.onpointerup=c.onpointercancel=()=>drag=null;
function frame(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;let w=Math.round(innerWidth*devicePixelRatio),h=Math.round(innerHeight*devicePixelRatio);if(c.width!==w||c.height!==h){c.width=w;c.height=h}let f=w*.7,hor=h*.42;let speed=p.riding?18:7;p.a+=((keys.d?1:0)-(keys.a?1:0))*dt*1.8;let move=((keys.w?1:0)-(keys.s?1:0))*dt*speed;p.x+=Math.sin(p.a)*move;p.z+=Math.cos(p.a)*move;p.mana=Math.min(100,p.mana+dt*4);for(let e of enemies){if(e.hp<=0&&t>e.dead){e.max+=5;e.hp=e.max}if(e.hp>0&&near(e,4))p.hp-=dt*8}if(p.hp<=0){p.hp=100;p.x=0;p.z=0;say('Respawned. Possessions retained.')}let sky=ctx.createLinearGradient(0,0,0,hor);sky.addColorStop(0,'#34445c');sky.addColorStop(1,'#b0a5a0');ctx.fillStyle=sky;ctx.fillRect(0,0,w,hor);ctx.fillStyle='#37453e';ctx.fillRect(0,hor,w,h-hor);function project(x,z){let dx=x-p.x,dz=z-p.z,X=dx*Math.cos(p.a)-dz*Math.sin(p.a),Z=dx*Math.sin(p.a)+dz*Math.cos(p.a);if(Z<.5)return null;return [w/2+X*f/Z,hor+2*f/Z,Z]}
let draw=[];for(let s of sites){for(let i=0;i<14;i++){let x=s.x+Math.sin(i*2.4)*(15+i*2),z=s.z+Math.cos(i*2.4)*(15+i*2);draw.push({x,z,height:5+i%4*3,width:5+i%3,color:['#656c72','#88796b','#4f5b65'][i%3]})}}for(let o of objects)draw.push({...o,height:4,width:5,color:'#867b67'});for(let e of enemies)if(e.hp>0)draw.push({...e,height:2,width:1,color:'#a74e49'});draw.map(o=>({...o,v:project(o.x,o.z)})).filter(o=>o.v&&o.v[2]<180).sort((a,b)=>b.v[2]-a.v[2]).forEach(o=>{let [x,y,z]=o.v,ww=o.width*f/z,hh=o.height*f/z;ctx.fillStyle=o.color;ctx.fillRect(x-ww/2,y-hh,ww,hh);ctx.fillStyle='#0004';ctx.fillRect(x+ww*.2,y-hh,ww*.3,hh);if(o.name){ctx.font=(14*devicePixelRatio)+'px system-ui';ctx.textAlign='center';ctx.fillStyle='white';ctx.fillText(o.name,x,y-hh-8)}});hud.innerHTML='ZEEBO • Prototype<br>HP '+Math.ceil(p.hp)+' | Mana '+Math.floor(p.mana)+'<br>Zero '+p.money+' | XP '+p.xp+'<br>'+msg;requestAnimationFrame(frame)}requestAnimationFrame(frame);setInterval(save,600000);
</script></html>
