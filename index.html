let viewThird=false, blocking=false, dodgeUntil=0;
const controls=document.getElementById('controls');
function actionButton(name,fn){let b=document.createElement('button');b.textContent=name;b.onclick=fn;controls.append(b);return b}
actionButton('Camera',()=>{viewThird=!viewThird;say(viewThird?'Third person':'First person')});
